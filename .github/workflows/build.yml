name: Build exact LineageOS SukiSU kernel for Xiaomi Mi 8

on:
  workflow_dispatch:
  push:
    branches:
      - susfs15-test

permissions:
  contents: read

env:
  KERNEL_REPOSITORY: duckyduckG/android_kernel_xiaomi_sdm845_419
  KERNEL_COMMIT: 2e1cfd38e5f3b53351d3d59c797d14ff7f050611
  SUKISU_VERSION: v4.1.3-40796
  SUKISU_COMMIT: 6c13a0695a1115e1000c998872b66f4ff5b2f11e
  SUSFS_COMMIT: 001e69919c6271f690fd00b17e4c721c9e599152
  SUSFS_VERSION: v1.5.5
  ANYKERNEL_COMMIT: e4b1bb25ca2aabcfd57f694a5998d87130701b71
  CLANG_VERSION: r563880

jobs:
  build-dipper:
    name: Build exact dipper SukiSU kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out build files
        uses: actions/checkout@v4

      - name: Check out exact LineageOS kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPOSITORY }}
          ref: ${{ env.KERNEL_COMMIT }}
          path: kernel
          fetch-depth: 1

      - name: Check out SukiSU Ultra
        uses: actions/checkout@v4
        with:
          repository: SukiSU-Ultra/SukiSU-Ultra
          ref: ${{ env.SUKISU_COMMIT }}
          path: kernel/KernelSU
          fetch-depth: 1

      - name: Check out native SUSFS for Linux 4.19
        run: |
          git init susfs
          git -C susfs remote add origin https://gitlab.com/simonpunk/susfs4ksu.git
          git -C susfs fetch --depth=1 origin "$SUSFS_COMMIT"
          git -C susfs checkout --detach FETCH_HEAD

      - name: Check out pinned AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          ref: ${{ env.ANYKERNEL_COMMIT }}
          path: ak3
          fetch-depth: 1

      - name: Verify pinned sources
        run: |
          test "$(git -C kernel rev-parse HEAD)" = "$KERNEL_COMMIT"
          test "$(git -C kernel/KernelSU rev-parse HEAD)" = "$SUKISU_COMMIT"
          test "$(git -C susfs rev-parse HEAD)" = "$SUSFS_COMMIT"
          test "$(git -C ak3 rev-parse HEAD)" = "$ANYKERNEL_COMMIT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libelf-dev libssl-dev lld llvm python3 zip

      - name: Restore Android 16 Clang cache
        id: clang-cache
        uses: actions/cache/restore@v4
        with:
          path: clang
          key: android-clang-linux-x86-${{ env.CLANG_VERSION }}

      - name: Download Android 16 Clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          for branch in android16-qpr2-release android16-release main-release; do
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${branch}/clang-${CLANG_VERSION}.tar.gz"
            echo "Trying ${url}"
            if curl -L --fail --retry 3 "$url" -o clang.tar.gz; then
              tar -xzf clang.tar.gz -C clang
              break
            fi
          done
          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Save Android 16 Clang cache
        if: steps.clang-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: clang
          key: android-clang-linux-x86-${{ env.CLANG_VERSION }}

      - name: Verify Android 16 Clang
        run: |
          test -x clang/bin/clang
          clang/bin/clang --version

      - name: Integrate native SUSFS v1.5.5 and SukiSU manual hooks
        working-directory: kernel
        run: |
          cp "$GITHUB_WORKSPACE/susfs/kernel_patches/fs/susfs.c" fs/susfs.c
          cp "$GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/susfs.h" include/linux/susfs.h
          cp "$GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/susfs_def.h" include/linux/susfs_def.h
          python3 "$GITHUB_WORKSPACE/scripts/adapt_susfs_419_patch.py" prepare \
            "$GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch" \
            /tmp/susfs-4.19-lineage.patch
          patch --dry-run --forward --fuzz=3 -p1 < /tmp/susfs-4.19-lineage.patch
          patch --forward --fuzz=3 -p1 < /tmp/susfs-4.19-lineage.patch
          test -z "$(find . -name '*.rej' -print -quit)"
          python3 "$GITHUB_WORKSPACE/scripts/adapt_susfs_419_patch.py" patch-namespace "$PWD"

          cp "$GITHUB_WORKSPACE/patches/susfs_legacy_prctl.c" \
            KernelSU/kernel/susfs_legacy_prctl.c
          python3 "$GITHUB_WORKSPACE/scripts/adapt_sukisu_susfs15.py"

          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/Kconfig")
          source = path.read_text()
          anchor = "endmenu"
          if source.count(anchor) < 1:
              raise SystemExit("drivers/Kconfig has no endmenu anchor")
          head, tail = source.rsplit(anchor, 1)
          path.write_text(head + 'source "drivers/kernelsu/Kconfig"\n\n' + anchor + tail)

          required = {
              "KernelSU/kernel/Kconfig": "config KSU_SUSFS_TRY_UMOUNT",
              "KernelSU/kernel/feature/sucompat.c": "ksu_handle_execveat",
              "KernelSU/kernel/susfs_legacy_prctl.c": "ksu_handle_susfs_prctl",
              "fs/Makefile": "CONFIG_KSU_SUSFS",
              "include/linux/susfs.h": '#define SUSFS_VERSION "v1.5.5"',
          }
          for path, needle in required.items():
              if needle not in Path(path).read_text():
                  raise SystemExit(f"SUSFS integration check failed: {path}: {needle}")
          PY
          python3 "$GITHUB_WORKSPACE/scripts/apply_sukisu_manual_hooks.py"

      - name: Configure dipper kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: 1
          LLVM_IAS: 1
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:/usr/lib/ccache:$PATH"
          make O=out vendor/sdm845-perf_defconfig
          make O=out vendor/xiaomi/sdm845-common.config
          make O=out vendor/xiaomi/dipper.config

          scripts/config --file out/.config \
            --enable KSU \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_HAS_MAGIC_MOUNT \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            --enable KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --disable KSU_SUSFS_SUS_OVERLAYFS \
            --enable KSU_SUSFS_TRY_UMOUNT \
            --enable KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --disable KPM
          make O=out olddefconfig

          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SUS_PATH=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' out/.config
          grep -qx '# CONFIG_KPM is not set' out/.config

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: 1
          LLVM_IAS: 1
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
          KBUILD_BUILD_USER: codex
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/clang/bin:/usr/lib/ccache:$PATH"
          make -j"$(nproc)" O=out KSU_VERSION=40796 Image.gz-dtb 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publish compiler failure summary
        if: failure()
        run: |
          summary=$(grep -E 'error:|undefined reference|multiple definition|ld\.lld:' build.log \
            | tail -n 20 \
            | tr '\n' ';' \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
          if [ -z "$summary" ]; then
            summary=$(tail -n 30 build.log \
              | tr '\n' ';' \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
          fi
          echo "::error file=kernel::$summary"

      - name: Verify compiled kernel
        working-directory: kernel
        run: |
          test -s out/arch/arm64/boot/Image
          test -s out/arch/arm64/boot/Image.gz-dtb
          strings out/arch/arm64/boot/Image > /tmp/dipper-kernel.strings
          grep -m1 -E '/data/adb/ksud|KernelSU|SukiSU' /tmp/dipper-kernel.strings
          grep -m1 -F 'susfs is initialized! version:' /tmp/dipper-kernel.strings
          grep -m1 -F "$SUSFS_VERSION" /tmp/dipper-kernel.strings

          {
            echo "source=${KERNEL_REPOSITORY}"
            echo "commit=${KERNEL_COMMIT}"
            echo "sukisu_version=${SUKISU_VERSION}"
            echo "sukisu_commit=${SUKISU_COMMIT}"
            echo "susfs_version=${SUSFS_VERSION}"
            echo "susfs_commit=${SUSFS_COMMIT}"
            echo "anykernel_commit=${ANYKERNEL_COMMIT}"
            echo "device=dipper"
            echo "ksu_driver_version=40796"
            echo "kernel_release=$(make -s O=out ARCH=arm64 kernelrelease)"
            echo "clang=$($GITHUB_WORKSPACE/clang/bin/clang --version | sed -n '1p')"
            echo "CONFIG_KSU=$(sed -n 's/^CONFIG_KSU=//p' out/.config)"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KPM=n"
            sha256sum out/arch/arm64/boot/Image.gz-dtb
          } > "$GITHUB_WORKSPACE/BUILD_INFO.txt"
          cat "$GITHUB_WORKSPACE/BUILD_INFO.txt"

      - name: Package AnyKernel3 ZIP
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb
          cp packaging/anykernel.sh ak3/anykernel.sh
          sed -i 's/\r$//' ak3/anykernel.sh
          if grep -q $'\r' ak3/anykernel.sh; then
            echo "anykernel.sh still contains CR characters" >&2
            exit 1
          fi
          rm -rf ak3/.git ak3/.github
          find ak3 -name placeholder -delete
          mkdir -p release
          cd ak3
          zip -qr9 ../release/SukiSU-dipper-Lineage23.2-40796-SUSFS-v1.5.5-noKPM-v8-test.zip . \
            -x 'README.md' 'LICENSE'
          cd ..
          cp BUILD_INFO.txt release/
          sha256sum release/SukiSU-dipper-Lineage23.2-40796-SUSFS-v1.5.5-noKPM-v8-test.zip \
            | tee release/SHA256SUMS.txt

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-dipper-Lineage23.2-40796-SUSFS-v1.5.5-noKPM-v8-test
          path: release/*
          if-no-files-found: error
          retention-days: 30
